server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers (intentionally minimal for ZAP findings)
    add_header X-Frame-Options "SAMEORIGIN";
    # Missing: CSP, HSTS, X-Content-Type-Options, Referrer-Policy
}